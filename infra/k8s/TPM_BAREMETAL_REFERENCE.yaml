# NOT DEPLOYABLE UNTIL FIVE SEPARATE PHYSICAL TPM2 HOSTS + ACTUAL DEVICE PLUGIN EXIST.
# A TPM does not automatically prove a PUF or correct physical event data.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: epu-tpm2-physical, namespace: innovulis-verify }
spec:
  serviceName: epu-tpm2-physical
  replicas: 5
  selector: { matchLabels: { app: epu-tpm2-physical } }
  template:
    metadata: { labels: { app: epu-tpm2-physical } }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        innovulis.io/operator-verified-baremetal-tpm2: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: epu-tpm2-physical } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: attestor
          image: registry.invalid/innovulis/epu-tpm2:NOT_PUBLISHED
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          # A reviewed TPM2 device plugin must provide resource name and device permissions.
          # This sample claims NO PUF and requests NO privileged host access.
          resources:
            requests: { cpu: 250m, memory: 256Mi, innovulis.io/tpm2: "1" }
            limits: { cpu: "1", memory: 1Gi, innovulis.io/tpm2: "1" }

