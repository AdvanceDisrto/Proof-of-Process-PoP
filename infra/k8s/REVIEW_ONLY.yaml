# DESIGN REFERENCE -- DO NOT kubectl apply blindly. No images published.
# Signed quorum is enforced by threshold/quorum.py, not by container placement alone.
# NetworkPolicy is only effective with a supporting/enforced CNI and a test.
apiVersion: v1
kind: Namespace
metadata:
  name: innovulis-core
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: innovulis-verify
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Three discrete jurors, each with unique keys and separate hosts.
# Images are intentionally unpublishable placeholders and must be independently
# pinned by SHA256 after reproducible CI builds and human deployment approval.
apiVersion: apps/v1
kind: Deployment
metadata: { name: juror-a, namespace: innovulis-core }
spec:
  replicas: 1
  selector: { matchLabels: { app: juror-a, juror: "true" } }
  template:
    metadata: { labels: { app: juror-a, juror: "true" } }
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { juror: "true" } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: juror
          image: registry.invalid/innovulis/juror-a:NOT_PUBLISHED
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: juror-b, namespace: innovulis-core }
spec:
  replicas: 1
  selector: { matchLabels: { app: juror-b, juror: "true" } }
  template:
    metadata: { labels: { app: juror-b, juror: "true" } }
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { juror: "true" } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: juror
          image: registry.invalid/innovulis/juror-b:NOT_PUBLISHED
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: juror-c, namespace: innovulis-core }
spec:
  replicas: 1
  selector: { matchLabels: { app: juror-c, juror: "true" } }
  template:
    metadata: { labels: { app: juror-c, juror: "true" } }
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { juror: "true" } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: juror
          image: registry.invalid/innovulis/juror-c:NOT_PUBLISHED
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: attest-relay, namespace: innovulis-core }
spec:
  replicas: 1
  selector: { matchLabels: { app: attest-relay } }
  template:
    metadata: { labels: { app: attest-relay } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: relay
          image: registry.invalid/innovulis/relay:NOT_PUBLISHED
          ports: [ { name: http-internal, containerPort: 9843 } ]
          env:
            - name: RELAY_BIND_HOST
              value: "0.0.0.0"
            - name: RELAY_EXPLICIT_NONLOCAL_OPT_IN
              value: "YES"
            - name: RELAY_REGISTRY_FILE
              value: /var/run/innovulis/registry/registry.json
            - name: RELAY_KEY_FILE
              value: /var/run/innovulis/key/ed25519.key
            - name: RELAY_REGISTRY_SHA256_PIN
              valueFrom: { secretKeyRef: { name: innovulis-independent-trust-pin, key: sha256 } }
            - name: RELAY_BEARER_TOKEN
              valueFrom: { secretKeyRef: { name: innovulis-relay-access-token, key: token } }
          volumeMounts:
            - { name: registry, mountPath: /var/run/innovulis/registry, readOnly: true }
            - { name: key, mountPath: /var/run/innovulis/key, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
      volumes:
        - name: registry
          secret: { secretName: innovulis-juror-registry }
        - name: key
          secret: { secretName: innovulis-relay-ed25519, defaultMode: 256 }
---
apiVersion: v1
kind: Service
metadata: { name: attest-relay, namespace: innovulis-core }
spec:
  selector: { app: attest-relay }
  ports: [ { name: http-internal, port: 9843, targetPort: 9843 } ]
---
# This external verifier is intentionally a placeholder; integration must do
# independent receipt signature verification and refuse fake QUORUM_APPROVED text.
apiVersion: apps/v1
kind: Deployment
metadata: { name: receipt-verifier, namespace: innovulis-verify }
spec:
  replicas: 2
  selector: { matchLabels: { app: receipt-verifier } }
  template:
    metadata: { labels: { app: receipt-verifier } }
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: receipt-verifier } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: verifier
          image: registry.invalid/innovulis/receipt-verifier:NOT_PUBLISHED
          ports: [ { containerPort: 8443 } ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
# Default deny verifier pod traffic both directions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: verifier-allow-relay-only, namespace: innovulis-verify }
spec:
  podSelector: { matchLabels: { app: receipt-verifier } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: innovulis-core } }
          podSelector: { matchLabels: { app: attest-relay } }
      ports: [ { protocol: TCP, port: 8443 } ]
  egress: []
---
# Juror egress restricted to relay only. CNI must enforce this rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: juror-egress-relay-only, namespace: innovulis-core }
spec:
  podSelector: { matchLabels: { juror: "true" } }
  policyTypes: [Egress]
  egress:
    - to: [ { podSelector: { matchLabels: { app: attest-relay } } } ]
      ports: [ { protocol: TCP, port: 9843 } ]
---
# Relay can only receive juror ingress, and only send to verifier.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: relay-traffic-limits, namespace: innovulis-core }
spec:
  podSelector: { matchLabels: { app: attest-relay } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [ { podSelector: { matchLabels: { juror: "true" } } } ]
      ports: [ { protocol: TCP, port: 9843 } ]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: innovulis-verify } }
          podSelector: { matchLabels: { app: receipt-verifier } }
      ports: [ { protocol: TCP, port: 8443 } ]

