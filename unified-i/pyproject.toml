[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "innovulis-unified-gate"
version = "1.0.0a1"
description = "i™ cross-component executable trust boundary and physical acceptance controller"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name="iNNOVULIS"}]
dependencies = ["cryptography>=41", "qrcode[pil]>=7.4", "fastapi>=0.110"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pyzbar>=0.1.9", "numpy>=1.26", "jsonschema>=4.19", "msgpack>=1.0", "opencv-python-headless>=4.8"]

[project.scripts]
innovulis-unified = "unified_i.cli:main"

[tool.setuptools]
packages = ["unified_i"]
include-package-data = true

[tool.setuptools.package-data]
unified_i = ["dashboard.html"]
