services:
  icl-engine:
    build:
      context: ..
      dockerfile: icl/Dockerfile
    container_name: icl-core-service
    ports:
      - "9000:9000"
    restart: unless-stopped
    environment:
      ICL_WEBHOOK_PORT: "9000"
      ICL_WEBHOOK_SECRET: ${ICL_WEBHOOK_SECRET:?set ICL_WEBHOOK_SECRET}\n      ICL_CONFIG_PATH: "icl.yaml"
      ICL_STORAGE_KEY_ID: ${ICL_STORAGE_KEY_ID:-}
      ICL_STORAGE_SECRET: ${ICL_STORAGE_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:9000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
