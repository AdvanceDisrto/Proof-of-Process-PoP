name: i™ Run All Ecosystem

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run all integrated proof surfaces
        run: |
          chmod +x run_all.sh
          ./run_all.sh

      - name: Upload master run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-run-all-${{ github.run_id }}
          path: evidence/run-all/${{ github.run_id }}/
          if-no-files-found: error

# UI deployment trigger: four holographic glass modes
