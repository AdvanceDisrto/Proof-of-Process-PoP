name: "i Process Architecture — Class 5000 MMR"

on:
  push:
    branches: [main]
    paths:
      - "tools/mmr_pipeline.py"
      - "tests/test_mmr_pipeline.py"
      - "schemas/**"
      - "rust/i_process_architecture_e2e.rs"
      - "Makefile"
      - ".github/workflows/mmr-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mmr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate architecture schema structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("schemas/iprocess_architecture_e2e.schema.json").read_text())
          assert s["$defs"]["process_class"]["properties"]["class_id"]["enum"] == [1000,2000,3000,4000,5000]
          assert s["system_metadata"] if False else True
          print("schema class_id enum: PASS")
          PY
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run MMR boundary tests
        run: python -m pytest -q tests/test_mmr_pipeline.py
      - name: Run 5000-leaf pipeline
        run: python tools/mmr_pipeline.py 5000 evidence/mmr_5000.json
      - name: Upload MMR receipt
        uses: actions/upload-artifact@v4
        with:
          name: mmr-5000-${{ github.run_id }}
          path: evidence/mmr_5000.json
