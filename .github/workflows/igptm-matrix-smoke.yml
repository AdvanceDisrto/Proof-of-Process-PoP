name: i™ ArtifactGPTm Matrix preview smoke
on:
  push:
    branches:
      - feature/innovulis-cih-sovereign-portal-20261110
    paths:
      - ".github/workflows/igptm-matrix-smoke.yml"
      - "docs/igptm-matrix-smoke-trigger.txt"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify source-bound Matrix preview and edge adapters
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, re, time
          FRONT="https://igptm-matrix-artifact-preview.onrender.com"
          API="https://igptm-matrix-api.innovulis-i-edge.workers.dev"
          ORIGIN=FRONT
          def call(url, method="GET", payload=None, timeout=35):
              data = json.dumps(payload).encode() if payload is not None else None
              hdr={"user-agent":"igptm-matrix-smoke/1.0","origin":ORIGIN,"accept":"application/json" if payload is not None else "text/html,application/json"}
              if data is not None: hdr["content-type"]="application/json"
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=hdr,method=method),timeout=timeout) as r:
                          return r.status,r.read(1000000).decode("utf-8","replace"),dict(r.headers)
                  except urllib.error.HTTPError as e:
                      return e.code,e.read(100000).decode("utf-8","replace"),dict(e.headers)
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==2: raise
                      time.sleep(5)
          status,html,h=call(FRONT+"/")
          assert status==200 and "ARTIFACTGPTm" in html,(status,html[:200])
          print("FRONTEND HTML PASS",status)
          scripts=re.findall(r'<script[^>]+src="([^"]+)"',html)
          assert scripts,(html[:500])
          status,js,h=call(FRONT+scripts[-1])
          assert status==200 and ("Local digest" in js or "LOCAL DIGEST" in js),(status,js[:200])
          print("BUILT MATRIX WORKSPACE ASSETS PASS",status)
          status,body,h=call(API+"/api/status")
          obj=json.loads(body)
          assert status==200 and obj["service"]=="igptm-matrix-edge" and obj["certified_live"] is False,(status,obj)
          print("EDGE STATUS PASS",status)
          status,body,h=call(API+"/api/market")
          m=json.loads(body)
          assert status==200 and len(m.get("quotes",[]))>0 and m.get("simulated") is False,(status,m)
          print("REAL MARKET PROVIDER PASS",[(x["symbol"],x["source"]) for x in m["quotes"]])
          status,body,h=call(API+"/api/receipts/verify",method="POST",payload={})
          assert status==422,(status,body[:200])
          print("SIGNED RECEIPT BAD INPUT FAILS CLOSED",status)
          status,body,h=call(API+"/api/buddy/chat",method="POST",payload={"message":"Explain the difference between an artifact hash and a proof of correctness in one sentence.","history":[]},timeout=60)
          b=json.loads(body)
          assert status==200 and b.get("external_action")=="NOT_EXECUTED" and isinstance(b.get("reply"),str),(status,b)
          print("BUDDY LIVE AI RESPONSE PASS",b.get("model"))
          PY
