name: i™ Matrix tunnel browser acceptance
on:
  push:
    branches: [feature/innovulis-cih-sovereign-portal-20261110]
    paths:
      - .github/workflows/igptm-matrix-motion-browser.yml
      - tests/igptm-matrix-motion.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing runtime
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify preinstalled stable Chrome
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Test live canvas movement, pause, resume and mobile viewport
        run: node tests/igptm-matrix-motion.mjs
