name: i™ Public Sites Security and Accessibility
on:
  push:
    paths:
      - 'web/innovulis/**'
      - 'ipwa/**'
      - 'tests/public-sites.test.mjs'
      - '.github/workflows/public-sites.yml'
  pull_request:
    paths:
      - 'web/innovulis/**'
      - 'ipwa/**'
      - 'tests/public-sites.test.mjs'
      - '.github/workflows/public-sites.yml'
permissions:
  contents: read
jobs:
  public-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public pages, claims, offline-only implementation
        run: node --test tests/public-sites.test.mjs
      - name: Verify receipt crypto adversarial suite
        run: node --test tests/ipwa-verifier.test.mjs tests/ipwa-wasm-v2.test.mjs
