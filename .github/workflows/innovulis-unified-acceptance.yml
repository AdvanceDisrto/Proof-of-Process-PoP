name: i™ Universal Integration - crypto, receipts, Twinions, electronics (software evidence only)
on:
  pull_request:
    paths:
      - 'unified-i/**'
      - 'ipcih-capsule/**'
      - 'paper-console/**'
      - 'human-hub/**'
      - 'twinions-legal/**'
      - '.github/workflows/innovulis-unified-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-crypto-optical-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native verified Open Source libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libz3-4 g++
      - name: Install test dependencies from local source, not private wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './unified-i[test]' -e './ipcih-capsule'
          python -m pip install 'build>=1.2' 'uvicorn>=0.21'
      - name: Composite test + QR optical + no-printer ESC/POS + loopback HTTP + host C++
        run: bash unified-i/ci/run_all.sh
      - name: Build and install new Python wheel from the checked-out files
        working-directory: unified-i
        run: |
          python -m build --wheel
          python -m pip install --no-deps --target /tmp/innovulis-installed dist/*.whl
          PYTHONPATH=/tmp/innovulis-installed python -c 'from unified_i.physical import record_report; assert record_report()["physical_acceptance"] is False; print("ISOLATED_WHEEL_GATE=PASS")'
      - name: Publish evidence without secrets, licensed public demo only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innovulis-unified-software-acceptance
          path: |
            unified-i/evidence/*.log
            unified-i/evidence/*.json
            unified-i/evidence/synthetic-smoke/acceptance.json
            unified-i/evidence/synthetic-smoke/signed_ipqr_synthetic.png
            unified-i/dist/*.whl
          if-no-files-found: ignore
          retention-days: 14
  existing-rtl-physical-gates-not-claimed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus, Verilator and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
      - name: Run Tessera-G existing RTL simulation/lint/generic synthesis
        run: bash tessera-g/ci/run_gate.sh
      - name: Run PoPC-PU existing RTL simulation/lint/generic synthesis
        run: bash paper-console/ci/run_rtl.sh
      - name: Publish headless test artifacts (never claim board programming)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innovulis-unified-rtl-headless-only
          path: |
            tessera-g/evidence/*.log
            paper-console/evidence/rtl/*.log
          if-no-files-found: ignore
          retention-days: 14
  mechanical-and-provisioning-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install concept enclosure renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad g++
      - name: Run C++ 16-gate host logic, shell render and irreversible provisioning BLOCK
        run: |
          bash unified-i/ci/smoke_hardware.sh
          python -c 'import json; d=json.load(open("unified-i/hardware/istick_reference.json")); assert d["manufacturing_state"]=="NOT_ROUTED_NOT_FAB_READY"'
      - name: Upload concept STL only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innovulis-istick-concept-not-fab-ready
          path: |
            unified-i/evidence/enclosure_preliminary.stl
            unified-i/evidence/cpp_gate.log
          if-no-files-found: ignore
          retention-days: 14
