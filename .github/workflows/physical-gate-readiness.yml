name: iNNOVULIS Hardware Readiness — software checks only
on:
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/physical-gate-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (never physical drivers or credentials)
        run: python -m pip install 'cryptography>=41' 'smbus2>=0.4'
      - name: Run simulated identity/signature adversarial tests
        run: |
          python -m unittest discover -s hardware/physical/tests -v 2>&1 | tee hardware_physical_test.log
      - name: Verify explicitly pending real hardware gates
        run: |
          python -m hardware.physical.gates readiness > hardware_readiness.json
          python - <<'PY'
          import json
          r=json.load(open('hardware_readiness.json'))
          assert r["physical_acceptance"]=="ACTION_REQUIRED"
          assert r["physical_printer"]=="NOT_TESTED"
          assert r["atecc608c_hardware_signing"]=="NOT_TESTED"
          assert r["real_ina226_measurement"]=="NOT_TESTED"
          assert r["fpga_programming"]=="NOT_ATTEMPTED"
          assert r["amd_gpu"]=="NOT_EXECUTED"
          print("PHYSICAL_GATE_CI=PASS_FAIL_CLOSED (hardware not accessed)")
          PY
      - name: Upload bounded nonsecret diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-readiness-software-only
          path: |
            hardware_physical_test.log
            hardware_readiness.json
          if-no-files-found: ignore
          retention-days: 14
