name: ORS v0.4 numerical research — CI and release gate

on:
  pull_request:
    paths:
      - 'ors-research/**'
      - '.github/workflows/ors-public-release.yml'
  push:
    branches:
      - main
      - 'feat/ors-v0.4-*'
    tags:
      - 'ors-v0.4.0'
    paths:
      - 'ors-research/**'
      - '.github/workflows/ors-public-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and dependencies
        working-directory: ors-research
        run: python -m pip install -U 'setuptools>=68' wheel build
          python -m pip install -e '.[test]'
      - name: Execute complete numerical software regression suite
        working-directory: ors-research
        run: |
          python -m pytest tests -q --junitxml=pytest-junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('pytest-junit.xml').getroot()
          suites=[root] if root.tag=='testsuite' else root.findall('testsuite')
          total=sum(int(s.attrib['tests']) for s in suites)
          failures=sum(int(s.attrib.get('failures','0'))+int(s.attrib.get('errors','0')) for s in suites)
          print('ORS_TESTS_EXECUTED',total,'FAILURES',failures)
          assert total==117 and failures==0, (total,failures)
          PY
      - name: Exercise local ASGI endpoints
        working-directory: ors-research
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from ors.service import app
          c=TestClient(app)
          health=c.get('/health')
          assert health.status_code==200 and health.json()['physical_gate']=='ACTION_REQUIRED'
          smoke=c.get('/v1/ors/smoke')
          assert smoke.status_code==200 and smoke.json()['physical_gate']=='ACTION_REQUIRED'
          assert smoke.json()['buckling']['status']=='NUMERICAL_MODE'
          print('ORS_ASGI_HEALTH_SMOKE_PASS')
          PY
      - name: Build wheel and assert metadata
        working-directory: ors-research
        run: |
          python -m build --wheel --no-isolation
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels=list(Path('dist').glob('innovulis_ors_numerical-0.4.0-*.whl'))
          assert len(wheels)==1,wheels
          with zipfile.ZipFile(wheels[0]) as z:
            meta=next(n for n in z.namelist() if n.endswith('.dist-info/METADATA'))
            s=z.read(meta).decode()
          assert 'Name: innovulis-ors-numerical' in s and 'Version: 0.4.0' in s
          print('ORS_WHEEL_METADATA_PASS')
          PY
          sha256sum dist/*.whl > SHA256SUMS.txt
      - name: Upload inspectable wheel/test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ors-v0.4-wheel-and-evidence
          if-no-files-found: warn
          path: |
            ors-research/dist/*.whl
            ors-research/SHA256SUMS.txt
            ors-research/pytest-junit.xml
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/ors-v0.4.0'
    needs: test-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ors-v0.4-wheel-and-evidence
      - name: Publish release only on explicitly pushed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl SHA256SUMS.txt pytest-junit.xml \
            --repo "$GITHUB_REPOSITORY" \
            --title 'iNNOVULIS ORS numerical research v0.4.0' \
            --notes '117 software regression tests and local ASGI smoke. NOT a validated orbital ring. Maxwell fields, rotor transport, materials, and hardware gates remain ACTION_REQUIRED.'
