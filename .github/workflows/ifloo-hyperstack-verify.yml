name: iFloo Orchestra — Hyperstack Verify

on:
  push:
    branches: [main]
    paths:
      - "mcp/compute-control/**"
      - ".github/workflows/ifloo-hyperstack-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: mcp/compute-control
        run: npm install
      - name: Execute iTSC Sovereign Compiler
        working-directory: mcp/compute-control
        run: npm run compile:itsc
      - name: Upload iTSC provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: itsc-compilation-receipt
          path: mcp/compute-control/itsc-receipt.json
      - name: Test fail-closed receipts and Orchestra routing
        working-directory: mcp/compute-control
        run: npm test
      - name: Hyperstack credential boundary
        env:
          HYPERSTACK_API_KEY: ${{ secrets.HYPERSTACK_API_KEY }}
        run: |
          if [ -z "$HYPERSTACK_API_KEY" ]; then
            echo "Hyperstack live execution: ACTION_REQUIRED (HYPERSTACK_API_KEY absent)"
          else
            echo "Hyperstack credential present; live provisioning is intentionally not performed by verification CI."
          fi
