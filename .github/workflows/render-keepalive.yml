name: i™ Render keepalive smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke origin health
        run: curl --fail --silent --show-error --max-time 20 https://proofofprocess.onrender.com/health

      - name: Smoke custom domain health
        run: curl --fail --silent --show-error --max-time 20 https://www.proofofprocess.online/health
