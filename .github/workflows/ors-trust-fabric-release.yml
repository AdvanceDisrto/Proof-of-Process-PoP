name: Publish iNNOVULIS Trust Fabric v0.4.1
on:
  push:
    branches: [main]
    paths:
      - 'ors-research/**'
      - '.github/workflows/ors-trust-fabric-release.yml'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ORS research dependencies
        working-directory: ors-research
        run: python -m pip install -e '.[test]' setuptools wheel
      - name: Compile production Tailwind v4 CSS
        working-directory: ors-research
        run: |
          npm install --no-save tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i ors/static/input.css -o ors/static/output.css --minify
          test -s ors/static/output.css
      - name: Verify exact release version, full suite and JUnit
        working-directory: ors-research
        run: |
          python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f: p=tomllib.load(f)
          assert p['project']['version']=='0.4.1'
          PY
          python -m pytest tests -q --junitxml=junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          t=ET.parse('junit.xml').getroot()
          s=t.find('testsuite') if t.tag=='testsuites' else t
          n=int(s.attrib['tests'])
          assert n == 132, f'Expected exact 132 tests, saw {n}'
          assert int(s.attrib.get('failures','0'))==0 and int(s.attrib.get('errors','0'))==0
          print('TRUST_FABRIC_132_TESTS_VERIFIED')
          PY
      - name: HTTP smoke and dashboard static assets
        working-directory: ors-research
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from ors.service import app
          c=TestClient(app)
          for p in ('/','/static/output.css','/health','/v1/ors/smoke'):
              r=c.get(p)
              assert r.status_code==200,(p,r.status_code,r.text[:300])
          assert 'ACTION_REQUIRED' in c.get('/health').text
          print('TRUST_FABRIC_LOCAL_HTTP_PASS')
          PY
      - name: Build installable wheel with compiled CSS
        working-directory: ors-research
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          import glob,zipfile
          names=glob.glob('dist/innovulis_ors_numerical-0.4.1-*.whl')
          assert len(names)==1,names
          with zipfile.ZipFile(names[0]) as z:
              members=z.namelist()
              assert any(x.endswith('ors/static/output.css') for x in members)
              assert any(x.endswith('ors/static/index.html') for x in members)
          print('TRUST_FABRIC_RELEASE_WHEEL_PASS')
          PY
          cd dist
          sha256sum *.whl > SHA256SUMS.txt
      - name: Upload independent release evidence
        uses: actions/upload-artifact@v4
        with:
          name: iNNOVULIS-trust-fabric-v0.4.1-evidence
          path: |
            ors-research/junit.xml
            ors-research/dist/*.whl
            ors-research/dist/SHA256SUMS.txt
      - name: Publish approved immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=trust-fabric-v0.4.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS: no replacement performed"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag exists without a release; fail closed to avoid retagging"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "iNNOVULIS Trust Fabric v0.4.1 — 132 tests, compiled Tailwind; physical gate ACTION_REQUIRED"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" \
            ors-research/dist/innovulis_ors_numerical-0.4.1-*.whl \
            ors-research/dist/SHA256SUMS.txt \
            ors-research/junit.xml \
            --title "iNNOVULIS Trust Fabric v0.4.1" \
            --notes "Software-only proof fabric: 132-test CI, signed-receipt prototypes and browser verifier. ORS hardware and carbon credit issuance NOT_IMPLEMENTED / ACTION_REQUIRED. Tailwind CSS compiled in the release runner. No FastAPI Cloud public-service claim."
