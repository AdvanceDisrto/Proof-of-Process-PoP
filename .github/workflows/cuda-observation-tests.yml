name: iRECEIPT CUDA Fail-Closed Development Tests
on:
  push:
    paths:
      - integrations/cuda_observation.py
      - tests/test_cuda_observation.py
      - .github/workflows/cuda-observation-tests.yml
  pull_request:
    paths:
      - integrations/cuda_observation.py
      - tests/test_cuda_observation.py
      - .github/workflows/cuda-observation-tests.yml
permissions:
  contents: read
jobs:
  cpu-negative-and-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<47'
      - run: python -m compileall -q integrations/cuda_observation.py tests/test_cuda_observation.py
      - run: python -m unittest discover -s tests -p test_cuda_observation.py -v
      - name: Ensure missing GPU runtime does not produce success
        run: |
          set +e
          python -m integrations.cuda_observation > cuda_probe_observation.json
          code=$?
          set -e
          cat cuda_probe_observation.json
          test "$code" -eq 2
          python -c 'import json; d=json.load(open("cuda_probe_observation.json")); assert d["verdict"]=="BLOCKED"'
