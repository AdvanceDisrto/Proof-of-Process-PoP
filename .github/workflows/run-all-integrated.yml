name: i™ Run All Integrated PoP
on:
  push:
    paths:
      - "run_all.sh"
      - "sovereign_cpu/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/run-all-integrated.yml"
  pull_request:
    paths:
      - "run_all.sh"
      - "sovereign_cpu/**"
      - "tools/**"
      - "tests/**"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/run-all-integrated.yml"

jobs:
  run-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CPU tensor runtime for real model execution
        run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute complete PoP run-all chain
        run: bash ./run_all.sh
      - name: Upload run-all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pop-run-all-evidence
          path: evidence/run-all/
          if-no-files-found: warn
