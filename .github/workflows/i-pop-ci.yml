name: i™ Unified Proof of Process CI
on:
  push:
  pull_request:
jobs:
  unified:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RTL simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install -r requirements.txt
      - name: iSKA sovereign key-chain verification
        run: make test-iska
      - name: Bare-metal iBare C build and self-test
        run: make test-ibare
      - name: CPU renderer verification
        run: make test-render
      - name: Verifiable Truth Infrastructure fail-closed reference
        run: make test-truth
      - name: GPU provider attestation router truth boundary
        run: make test-attestation-router
      - name: Physical evidence Merkle fail-closed gate
        run: make test-physical-merkle
      - name: SPU C++ reference, ECC, MMIO and materialization gates
        run: make test-spu-reference
      - name: SPU ML-DSA-87 verification
        run: make test-spu-ml-dsa
      - name: SPU RTL route and locked hierarchy simulation
        run: make test-spu-rtl
      - name: SPU source custody, policy and fail-closed materialization
        run: make test-spu-custody test-spu-source-policy test-spu-materialization test-spu-orfs
      - name: RTL + software E2E truth-boundary verification
        run: make test-e2e
      - name: Portable SIMD daemon build and self-test
        run: make test-daemon
      - name: Hardened Ed25519 + SIMD truth-boundary verification
        run: make test-hardened
      - name: iBare Python FFI bridge test
        run: python -m pytest -q tests/test_ibare_ffi.py
      - name: Universal polyglot adapter self-test
        run: python -m polyglot.adapter --self-test
      - name: Generate polyglot ProcessReceipt
        run: python -m polyglot.adapter --root . --output POLYGLOT_PROCESS_RECEIPT.json
      - name: Python evidence tests
        run: python -m pytest -q
      - name: FastAPI truth-boundary contract
        run: python -m pytest -q tests/test_api_contract.py
      - name: Rust deterministic compiler tests
        run: cd intelligence/tai_compiler && cargo test
      - name: TypeScript engine compile and tests
        run: cd intelligence/server && npm install && npm run build && npm test
      - name: Docker build
        run: docker build -t i-pop-core:ci .
      - name: Cloudflare Worker syntax and edge policy tests
        run: |
          node --check cloudflare-worker/index.js
          node --test cloudflare-worker/test/index.test.mjs
      - name: Generate parallel evidence
        run: python -m proof.parallel_pop
      - name: Generate reality manifest
        run: python -m proof.universe_manifest
      - uses: actions/upload-artifact@v4
        with:
          name: i-unified-pop-evidence
          path: |
            PARALLEL_MASTER_RECEIPT.json
            MASTER_REALITY_LEDGER.json
            POLYGLOT_PROCESS_RECEIPT.json
            E2E_REALITY_MANIFEST.json
            evidence/spu_evidence_receipt.json
            rtl/ispu10240/SHA256SUMS.v1.5
