name: artifactgptm.com real browser acceptance
on:
  push:
    branches: [feature/innovulis-cih-sovereign-portal-20261110]
    paths:
      - ".github/workflows/artifactgptm-browser-acceptance.yml"
      - "tests/artifactgptm-browser.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify public Matrix animation, UTC clock, voice controls and live news panel
        run: node tests/artifactgptm-browser.mjs
