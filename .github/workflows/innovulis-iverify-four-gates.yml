name: iNNOVULIS iVerify Four-Gate CI Evidence
on:
  push:
    paths:
      - 'innovulis/ci/**'
      - '.github/workflows/innovulis-iverify-four-gates.yml'
  pull_request:
    paths:
      - 'innovulis/ci/**'
      - '.github/workflows/innovulis-iverify-four-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-four-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier and test dependencies
        run: python -m pip install 'cryptography>=42,<47' 'pytest>=8,<10'
      - name: Execute 29 CI receipt checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          python -m pytest -q -vv innovulis/ci/test_receipt_gates.py | tee ci-evidence/pytest.log
          grep -Eq '29 passed' ci-evidence/pytest.log
      - name: Produce signed four-gate witness and source digests
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          from cryptography.hazmat.primitives.asymmetric import ed25519
          from innovulis.ci.receipt_core import sign_receipt,verify,sha,pubraw
          priv=ed25519.Ed25519PrivateKey.generate()
          banner=b"iNNOVULIS CI: 29 receipt-gate checks; PHYSICAL_GATE=ACTION_REQUIRED"
          receipt=sign_receipt(priv,sha(banner),sha(b"29 receipt checks"),"iNNOVULIS/ci-reference","0.4.1")
          pin=pubraw(priv)
          good=verify(receipt,pin,banner=banner)
          tampered=verify(receipt,pin,banner=banner.replace(b"ACTION_REQUIRED",b"GREEN"))
          urn_changed=json.loads(json.dumps(receipt))
          urn_changed["receipt_urn"]="urn:iverify:"+"e"*64
          urn_gate=verify(urn_changed,pin,banner=banner)
          assert good["ok"] and not tampered["ok"] and not urn_gate["ok"]
          assert urn_gate["integrity_ok"] and urn_gate["signature_ok"]
          source={}
          for name in ["innovulis/ci/receipt_core.py","innovulis/ci/test_receipt_gates.py"]:
              source[name]=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
          evidence={"scope":"CI_REFERENCE_ONLY_NOT_FULL_FASTAPI_v0.4.1",
                    "commit":os.environ.get("GITHUB_SHA"),
                    "run_id":os.environ.get("GITHUB_RUN_ID"),
                    "runner":"github-actions-ubuntu-24.04",
                    "pytest_cases":29,
                    "test_result":"PASS",
                    "signed_receipt":receipt,
                    "independent_external_pin":pin,
                    "four_gates":{"original":good,"banner_tamper":tampered,"urn_only_tamper":urn_gate},
                    "source_sha256":source,
                    "physical_gate":"ACTION_REQUIRED",
                    "does_not_prove":["full FastAPI v0.4.1 release suite passed in CI",
                                      "photonic or FPGA hardware execution",
                                      "AI computation correctness"]}
          pathlib.Path("ci-evidence/receipt-ci-witness.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\\n")
          pathlib.Path("ci-evidence/banner.txt").write_bytes(banner)
          print("CI_WITNESS_OK")
          PY
      - name: SHA-256 evidence manifest
        if: always()
        run: |
          (cd ci-evidence && sha256sum * > SHA256SUMS.txt)
          cat ci-evidence/SHA256SUMS.txt
      - name: Upload independent CI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: innovulis-iverify-four-gates-evidence
          path: ci-evidence/
          retention-days: 30
          if-no-files-found: error
