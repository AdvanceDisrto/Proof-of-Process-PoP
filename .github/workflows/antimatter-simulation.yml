name: Antimatter Simulation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic C/Python verification
        run: make test-antimatter
      - name: Upload evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: antimatter-evidence
          path: evidence/antimatter_evidence_receipt.json
