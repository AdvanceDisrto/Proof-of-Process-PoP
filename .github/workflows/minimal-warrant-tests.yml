name: Minimal Receipt + Tier2 Warrant Gates
on:
  push:
    paths:
      - integrations/minimal_warrant.py
      - tests/test_minimal_warrant.py
      - .github/workflows/minimal-warrant-tests.yml
  pull_request:
    paths:
      - integrations/minimal_warrant.py
      - tests/test_minimal_warrant.py
      - .github/workflows/minimal-warrant-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=42,<47"
      - run: python -m compileall -q integrations/minimal_warrant.py tests/test_minimal_warrant.py
      - run: python -m unittest discover -s tests -p test_minimal_warrant.py -v
