name: Buddy signed v2 receipt and browser verifier tests
on:
  push:
    branches: [feature/buddy-v2-signed-epistemic-receipts-20261111]
    paths:
      - 'brain_registry.py'
      - 'buddy_receipt_v2/**'
      - '.github/workflows/buddy-receipt-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies only
        run: python -m pip install cryptography jsonschema qrcode pillow
      - name: V1 legacy regression: unchanged signed bytes and 21 tests
        run: python brain_registry.py --tests
      - name: Generate ephemeral demo signatures and QR; keep no private key
        env:
          PYTHONPATH: .
        run: python buddy_receipt_v2/build_demo.py
      - name: V2 Python schema, signature, chain and Unicode tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s buddy_receipt_v2 -p test_v2.py -v
      - name: Independent Node WebCrypto cross-language and exact UI checks
        run: |
          node buddy_receipt_v2/test_v2_node.cjs
          node buddy_receipt_v2/test_verifier_ui.cjs
      - name: Honest execution boundaries
        run: |
          echo "No production signing key, deployment, physical scanning or HTML capsule execution."
          echo "v1 remains UNSIGNED; demo v2 trusted key is EPHEMERAL and PINNED IN VIEWER."
