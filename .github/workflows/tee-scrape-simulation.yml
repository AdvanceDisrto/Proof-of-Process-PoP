name: TEE Scrape Simulation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run fail-closed TEE simulation tests
        run: python -m pytest tests/test_tee_scrape.py -v
      - name: Emit evidence receipt
        run: python tools/tee_scrape_simulator.py evidence/tee_scrape_evidence_receipt.json
      - name: Upload evidence receipt
        uses: actions/upload-artifact@v4
        with:
          name: tee-scrape-evidence
          path: evidence/tee_scrape_evidence_receipt.json
