name: PoP Accountability + SAPU
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest cryptography
      - name: Run boundary tests
        run: python -m pytest -q tests/test_arc3.py tests/test_sapu.py tests/test_envelop.py tests/test_real_run_graph.py --no-header
      - name: Build signed SAPU evidence fixture
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json
          from sapu.reference import SAPU
          s=SAPU("evidence/sapu_key.hex")
          s.admit("request",{"prompt":"build-test","params":{"temperature":0.0}})
          s.admit("response",{"determinism":{"attempted":True,"matched":True}})
          s.admit("attestation",{})
          s.lock()
          s.derive()
          r=s.sign()
          open("evidence/sapu_receipt.json","w").write(json.dumps(r,indent=2)+"\n")
          print(r["derived"])
          PY
      - name: Build local master and final-verify it
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.mmr import MMR,sha
          E=Path("evidence")
          m=MMR()
          arts=[]
          for f in sorted(E.glob("*.json")):
            b=f.read_bytes()
            m.append(b)
            arts.append({"file":f.name,"kind":"receipt","sha256":sha(b)})
          master={"spec":"innovulis-test-master/1.0","artifact_count":len(arts),"artifacts":arts,"master_mmr_root":m.root(),"physical_gate":"ACTION_REQUIRED"}
          (E/"MASTER_RUN_RECEIPT.json").write_text(json.dumps(master,indent=2)+"\n")
          PY
          python -m tools.final_verify --evidence evidence --out VERIFY_RESULTS.json
      - uses: actions/upload-artifact@v4
        with:
          name: pop-accountability-${{ github.run_id }}
          path: |
            evidence/
            VERIFY_RESULTS.json
