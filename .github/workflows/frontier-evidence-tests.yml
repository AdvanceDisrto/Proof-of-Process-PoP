name: Frontier evidence and physical receipt gates
on:
  push:
    paths:
      - "integrations/frontier_evidence.py"
      - "integrations/pop_inference_bridge.py"
      - "integrations/ireceipt_thermal.py"
      - "tests/test_frontier_evidence.py"
      - "tests/test_pop_inference_print.py"
      - ".github/workflows/frontier-evidence-tests.yml"
  pull_request:
    paths:
      - "integrations/frontier_evidence.py"
      - "integrations/pop_inference_bridge.py"
      - "integrations/ireceipt_thermal.py"
      - "tests/test_frontier_evidence.py"
      - "tests/test_pop_inference_print.py"
      - ".github/workflows/frontier-evidence-tests.yml"
permissions:
  contents: read
jobs:
  proof-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature verification dependency
        run: python -m pip install "cryptography>=42,<47"
      - name: Compile modules
        run: python -m compileall -q integrations/frontier_evidence.py integrations/pop_inference_bridge.py integrations/ireceipt_thermal.py
      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -p 'test_frontier_evidence.py' -v && python -m unittest discover -s tests -p 'test_pop_inference_print.py' -v
