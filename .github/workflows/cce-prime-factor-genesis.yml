name: CCE Prime Factor Epistemic Genesis

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/cce_prime_factor_probe.py"
      - "tests/test_cce_prime_factor_probe.py"
      - ".github/workflows/cce-prime-factor-genesis.yml"

permissions:
  contents: read

jobs:
  cce-prime-factor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test fail-closed prime-factor probe
        run: python -m pytest tests/test_cce_prime_factor_probe.py -q --no-header

      - name: Execute mechanism against harness-held truth
        run: |
          mkdir -p evidence/cce-prime-factor
          python tools/cce_prime_factor_probe.py | tee evidence/cce-prime-factor/receipt.json

      - name: Re-verify receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.cce_prime_factor_probe import verify_receipt
          r = json.loads(Path("evidence/cce-prime-factor/receipt.json").read_text())
          errors = verify_receipt(r)
          assert not errors, errors
          assert r["validation"]["success"] is True
          assert r["ilogic"]["tier"] == "VERIFIED_PROCESS"
          assert r["ilogic"]["attestation_axis"] == "UNATTESTED"
          assert r["physical_gate"] == "ACTION_REQUIRED"
          print("CCE prime-factor receipt re-verifies.")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cce-prime-factor-${{ github.run_id }}
          path: evidence/cce-prime-factor/
