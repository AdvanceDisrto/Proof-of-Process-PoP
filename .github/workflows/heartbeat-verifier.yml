name: "Heartbeat Verifier"
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: pip install -r requirements.txt pytest
      - name: Run heartbeat checks
        run: python tools/heartbeat_receipt.py "evidence/heartbeats/$GITHUB_RUN_ID.json"
      - name: Upload heartbeat receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-${{ github.run_id }}
          path: evidence/heartbeats/*.json
