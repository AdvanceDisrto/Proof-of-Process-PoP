name: AeGi Synthetic Ledger Z3 Ed25519 Merkle Acceptance

on:
  push:
    branches: [feat/aegi-synthetic-ledger-smoke]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real solver and crypto
        run: python -m pip install z3-solver cryptography
      - name: Run negative and positive tests
        run: python -m unittest discover -s tests -p 'test_aegi_synthetic_ledger.py' -v
      - name: Execute signed synthetic smoke
        run: python -m integrations.aegi_synthetic_ledger
