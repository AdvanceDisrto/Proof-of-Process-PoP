name: iTensor Independent Export Verification
on:
  push:
    paths:
      - integrations/itensor_export_verifier.py
      - tests/test_itensor_export_verifier.py
      - .github/workflows/itensor-export-verifier.yml
  pull_request:
    paths:
      - integrations/itensor_export_verifier.py
      - tests/test_itensor_export_verifier.py
      - .github/workflows/itensor-export-verifier.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<47'
      - run: python -m compileall -q integrations/itensor_export_verifier.py tests/test_itensor_export_verifier.py
      - run: python -m unittest discover -s tests -p test_itensor_export_verifier.py -v
