name: iNNOVULIS Paper Console + PoPC-PU (software & RTL acceptance)
on:
  pull_request:
    paths:
      - 'paper-console/**'
      - '.github/workflows/paper-console-popc-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-real-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optical scanner library for independent QR pixel readback
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0
      - name: Install Python dependencies and Open Receipt v1 verifier
        working-directory: paper-console
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install 'cryptography>=41' 'msgpack>=1' 'opencv-python-headless>=4.8' 'pyzbar>=0.1.9'
          # The original independent verifier v1.0 source is intentionally
          # vendored as auditable Python rather than downloading opaque code.
          if [ -f integrations/innovulis_open_receipt_verifier-1.0.0-py3-none-any.whl ]; then
            python -m pip install integrations/innovulis_open_receipt_verifier-1.0.0-py3-none-any.whl
          fi
      - name: Run adversarial local software suite
        working-directory: paper-console
        run: PYTHONPATH=.:integrations python -m pytest -q tests
      - name: Real NumPy SVD + unverified atlas + real signed QR optical smoke
        working-directory: paper-console
        run: |
          mkdir -p evidence
          PYTHONPATH=.:integrations python -m paper_console demo --out evidence/demo > evidence/demo_stdout.json
          PYTHONPATH=.:integrations python ci/smoke_signed_qr.py evidence/signed-optical
      - name: Upload software evidence (only ephemeral synthetic keys; no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-console-offline-synthetic-smoke
          path: paper-console/evidence/
          retention-days: 14
          if-no-files-found: ignore
  rtl-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL simulation and synthesis
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
      - name: Run real Icarus + strict Verilator + generic Yosys
        working-directory: paper-console
        run: bash ci/run_rtl.sh
      - name: Upload RTL evidence, not FPGA claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-console-popc-rtl-evidence
          path: paper-console/evidence/rtl/
          retention-days: 14
          if-no-files-found: ignore
