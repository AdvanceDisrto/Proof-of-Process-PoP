name: i™ Sovereign CPU Proof
on:
  push:
    paths:
      - "sovereign_cpu/**"
      - "tests/test_sovereign_cpu.py"
      - ".github/workflows/sovereign-cpu.yml"
      - "schemas/iproof-v1.schema.json"
  pull_request:
    paths:
      - "sovereign_cpu/**"
      - "tests/test_sovereign_cpu.py"
      - ".github/workflows/sovereign-cpu.yml"
      - "schemas/iproof-v1.schema.json"
jobs:
  cpu-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Run sovereign CPU unit proof
        run: python -m pytest -q tests/test_sovereign_cpu.py tests/test_sovereign_tokenizer.py
      - name: Verify package imports
        run: python -c "import sovereign_cpu.gateway, sovereign_cpu.receipt, sovereign_cpu.toy_ssm"
      - name: Run dependency-free SSM smoke
        run: python -m sovereign_cpu.toy_ssm
      - name: Bounded Gaia CPU scale probe
        run: python -m sovereign_cpu.scale_probe --max-probe-mb 256 --safety-fraction 0.50 --output scale_probe_receipt.json
      - name: Upload scale probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-cpu-scale-probe
          path: scale_probe_receipt.json
