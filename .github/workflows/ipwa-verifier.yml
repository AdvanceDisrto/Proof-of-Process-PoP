name: i™ iPWA offline verifier
on:
  push:
    paths:
      - 'ipwa/**'
      - 'tests/ipwa-verifier.test.mjs'
      - '.github/workflows/ipwa-verifier.yml'
  pull_request:
    paths:
      - 'ipwa/**'
      - 'tests/ipwa-verifier.test.mjs'
      - '.github/workflows/ipwa-verifier.yml'
permissions:
  contents: read
jobs:
  offline-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check ipwa/verifier.mjs && node --check ipwa/sw.js
      - name: Check generated WASM known answer vectors and evidence archive
        run: node --test tests/ipwa-wasm-v2.test.mjs
      - name: Cryptographic tamper / fail-closed tests
        run: node --test tests/ipwa-verifier.test.mjs
