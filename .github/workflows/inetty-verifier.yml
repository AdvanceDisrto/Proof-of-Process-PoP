name: "iNetty Verifier"
on:
  push:
    branches: [main]
    paths:
      - "iNetty/**"
      - "tools/inetty_verifier.py"
      - "tools/sovereign_mesh_node.py"
      - "tests/test_inetty.py"
      - "fabric_topology_validator.py"
      - "tests/test_fabric_topology_validator.py"
      - "FABRIC.md"
      - "fabric_route_attestation.py"
      - "tests/test_fabric_route_attestation.py"
      - "FABRIC_ROUTE_ATTESTATION.md"
      - "src/agentic_core/root_cause_agent.ts"
      - "src/translation/lab_automation_api.ts"
      - "src/translation/physical_evidence_gate.ts"
      - "src/e2e_pipeline.ts"
      - "tests/test_e2e_pipeline.ts"
      - "tests/test_physical_evidence_gate.ts"
      - "E2E_PIPELINE.md"
      - "PHYSICAL_EVIDENCE_GATE.md"
      - "src/crypto/attestation_evidence.ts"
      - "src/crypto/ots_evidence.ts"
      - "src/physical/actuator_evidence.ts"
      - "src/translation/physical_dispatch_bundle.ts"
      - "src/quarantine/quarantine_ledger.ts"
      - "tests/test_physical_integrations.ts"
      - "PHYSICAL_INTEGRATIONS.md"
      - "src/crypto/ots_anchoring.ts"
      - "tests/test_ots_anchoring.ts"
      - "OTS_INTEGRATION.md"
      - ".github/workflows/inetty-verifier.yml"
  pull_request:
    paths:
      - "iNetty/**"
      - "tools/inetty_verifier.py"
      - "tools/sovereign_mesh_node.py"
      - "tests/test_inetty.py"
      - "fabric_topology_validator.py"
      - "tests/test_fabric_topology_validator.py"
      - "fabric_route_attestation.py"
      - "tests/test_fabric_route_attestation.py"
      - "src/agentic_core/root_cause_agent.ts"
      - "src/translation/lab_automation_api.ts"
      - "src/translation/physical_evidence_gate.ts"
      - "src/e2e_pipeline.ts"
      - "tests/test_e2e_pipeline.ts"
      - "tests/test_physical_evidence_gate.ts"
      - "src/crypto/attestation_evidence.ts"
      - "src/crypto/ots_evidence.ts"
      - "src/physical/actuator_evidence.ts"
      - "src/translation/physical_dispatch_bundle.ts"
      - "src/quarantine/quarantine_ledger.ts"
      - "tests/test_physical_integrations.ts"
      - "PHYSICAL_INTEGRATIONS.md"
      - ".github/workflows/inetty-verifier.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest cryptography
      - name: Verify manifest boundary
        run: |
          python - <<'PY'
          import json
          m=json.load(open("iNetty/NETTY_MANIFEST.json"))
          assert m["mark"]=="iNetty™️🧾"
          assert m["physical_gate"]=="ACTION_REQUIRED"
          assert any(x["tier"]=="ACTION_REQUIRED" for x in m["tiered_evidence"])
          print("iNetty manifest boundary PASS")
          PY
      - name: Run iNetty tests
        run: python -m pytest tests/test_inetty.py -q
      - name: Run Fabric topology tests
        run: python -m pytest tests/test_fabric_topology_validator.py -q
      - name: Run Fabric route attestation tests
        run: python -m pytest tests/test_fabric_route_attestation.py -q
      - name: Run E2E agentic core + physical evidence tests
        run: |
          npx --yes tsx tests/test_e2e_pipeline.ts
          npx --yes tsx tests/test_physical_evidence_gate.ts
          npx --yes tsx tests/test_physical_integrations.ts
          npx --yes tsx tests/test_ots_anchoring.ts
      - name: Emit sovereign mesh receipt
        run: python tools/sovereign_mesh_node.py
      - name: Emit routing receipt
        run: python tools/inetty_verifier.py
      - uses: actions/upload-artifact@v4
        with:
          name: inetty-evidence
          path: evidence/inetty_*.json
