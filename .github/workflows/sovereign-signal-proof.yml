name: "Sovereign Signal Proof"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signal-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install proof dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Buddy liveness self-test
        run: python tools/buddy_liveness_proof.py self-test
      - name: Run iNetty smallest proof
        run: python tools/inetty_smallest_proof.py
      - name: Run signal proof tests
        run: python -m pytest -q tests/test_buddy_liveness.py tests/test_inetty_smallest_proof.py
      - name: Run integrated Make target
        run: make test-signal-proof
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-signal-proof-${{ github.run_id }}
          path: |
            evidence/buddy_self_test.json
            evidence/inetty_smallest_proof.json
