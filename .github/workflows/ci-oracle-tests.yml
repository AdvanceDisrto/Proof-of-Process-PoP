name: CI Orchestra Oracle deterministic gates
on:
  push:
    paths:
      - 'integrations/ci_oracle.py'
      - 'integrations/ci_sign_gate.py'
      - 'tests/test_ci_oracle.py'
      - '.github/workflows/ci-oracle-tests.yml'
  pull_request:
    paths:
      - 'integrations/ci_oracle.py'
      - 'integrations/ci_sign_gate.py'
      - 'tests/test_ci_oracle.py'
      - '.github/workflows/ci-oracle-tests.yml'
permissions:
  contents: read
jobs:
  oracle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptographic verification library
        run: python -m pip install 'cryptography>=42,<47'
      - name: Compile
        run: python -m compileall -q integrations/ci_oracle.py integrations/ci_sign_gate.py
      - name: Run deterministic Oracle and receipt gate tests
        run: python -m unittest discover -s tests -p test_ci_oracle.py -v
      - name: Confirm unsigned pipeline cannot self-certify
        shell: bash
        run: |
          set +e
          python -m integrations.ci_sign_gate
          code=$?
          if [ "$code" -eq 0 ]; then
            echo 'ERROR: unsigned build was promoted'
            exit 1
          fi
          echo 'EXPECTED FAIL-CLOSED: no trusted signed receipt available'
