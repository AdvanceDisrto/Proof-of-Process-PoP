name: RunPod EiL Pinned Witness Gate
on:
  push:
    paths:
      - integrations/runpod_eil_gpu.py
      - integrations/runpod_eil_witness_gate.py
      - tests/test_runpod_eil_witness_gate.py
      - .github/workflows/runpod-eil-witness.yml
  pull_request:
    paths:
      - integrations/runpod_eil_gpu.py
      - integrations/runpod_eil_witness_gate.py
      - tests/test_runpod_eil_witness_gate.py
      - .github/workflows/runpod-eil-witness.yml
permissions:
  contents: read
jobs:
  authority-negative-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<47'
      - run: python -m compileall -q integrations/runpod_eil_gpu.py integrations/runpod_eil_witness_gate.py tests/test_runpod_eil_witness_gate.py
      - run: python -m unittest discover -s tests -p test_runpod_eil_witness_gate.py -v
