name: EiL Production Trust Fail-Closed Gates
on:
  push:
    paths:
      - integrations/eil_production_trust.py
      - integrations/eil_production_check.py
      - tests/test_eil_production_trust.py
      - .github/workflows/eil-production-trust.yml
  pull_request:
    paths:
      - integrations/eil_production_trust.py
      - integrations/eil_production_check.py
      - tests/test_eil_production_trust.py
      - .github/workflows/eil-production-trust.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=42,<47'
      - run: python -m compileall -q integrations/eil_production_trust.py integrations/eil_production_check.py tests/test_eil_production_trust.py
      - run: python -m unittest discover -s tests -p test_eil_production_trust.py -v
