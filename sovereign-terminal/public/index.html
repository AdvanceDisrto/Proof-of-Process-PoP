<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020606">
<title>i™ Sovereign Terminal</title>
<link rel="stylesheet" href="./vendor/xterm.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020606;color:#b8fff2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;grid-template-rows:auto auto 1fr 120px;overflow:hidden}.status,.keys{display:flex;gap:7px;align-items:center;padding:8px;background:#07100f}.status{border-bottom:1px solid #183b35}.keys{overflow:auto;border-bottom:1px solid #183b35}.status input{margin-left:auto;max-width:180px;background:#020606;border:1px solid #28584f;color:white;padding:8px;border-radius:9px}.status button,.keys button{background:#0a1715;color:#b8fff2;border:1px solid #28584f;border-radius:9px;padding:8px 10px;font:inherit;white-space:nowrap}#term{min-height:0;background:#000;padding:6px}#feed{overflow:auto;border-top:1px solid #183b35;padding:6px 8px;font-size:10px;color:#72e7ce;background:#010303}.muted{color:#65827d}.brand{font-weight:900;letter-spacing:.08em}
</style>
</head>
<body>
<div class="status"><span class="brand">i™ SOVEREIGN TERMINAL</span><span id="state" class="muted">OFFLINE</span><input id="token" type="password" placeholder="iKey token"><button id="connect">CONNECT</button></div>
<div class="keys"><button data-k="\x03">Ctrl-C</button><button data-k="\x04">Ctrl-D</button><button data-k="\x1b[A">↑</button><button data-k="\x1b[B">↓</button><button data-k="\x1b[C">→</button><button data-k="\x1b[D">←</button><button data-k="\t">Tab</button><button data-k="\x1b">Esc</button><button data-k="|">|</button><button data-k="~">~</button><button data-k="/">/</button><button data-k="-">-</button></div>
<div id="term"></div><div id="feed"></div>
<script src="./vendor/xterm.js"></script>
<script src="./vendor/xterm-addon-fit.js"></script>
<script>
const term=new Terminal({fontFamily:"ui-monospace,monospace",fontSize:13,cursorBlink:true,theme:{background:"#000000",foreground:"#b8fff2",cursor:"#73ffe2"}});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById("term"));fit.fit();
let ws;const state=document.getElementById("state"),feed=document.getElementById("feed"),token=document.getElementById("token");
function decodeKey(s){return s.replace(/\\x([0-9a-fA-F]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\t/g,"\t")}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function receipt(r){const d=document.createElement("div");d.textContent="["+r.sequence+"] "+(r.command_text||r.event)+" -> "+r.hash.slice(0,22)+"…";feed.appendChild(d);feed.scrollTop=feed.scrollHeight}
document.getElementById("connect").onclick=()=>{if(ws)ws.close();const proto=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(proto+"://"+location.host+"/terminal");state.textContent="CONNECTING";ws.onopen=()=>send({type:"auth",token:token.value});ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="output")term.write(m.data);else if(m.type==="receipt")receipt(m.receipt);else if(m.type==="ready"){state.textContent="CONNECTED";term.focus();send({type:"resize",cols:term.cols,rows:term.rows})}else if(m.type==="error")state.textContent="DENIED"};ws.onclose=()=>state.textContent="OFFLINE";ws.onerror=()=>state.textContent="ERROR"};
term.onData(data=>send({type:"input",data}));
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{send({type:"input",data:decodeKey(b.dataset.k)});term.focus()});
addEventListener("resize",()=>{fit.fit();send({type:"resize",cols:term.cols,rows:term.rows})});
</script>
</body></html>
