[package]
name = "innovulis-runpod-gpu-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "AMD-only headless Vulkan/wgpu DAG compute and Z3 integration smoke"

[dependencies]
bytemuck = { version = "1.18", features = ["derive"] }
pollster = "0.3"
wgpu = "0.19.4"
z3 = "0.12.1"
naga = { version = "0.19", features = ["wgsl-in"] }
