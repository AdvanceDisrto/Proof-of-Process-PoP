version: 2.1

jobs:
  root-native:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install native build prerequisites
          command: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run:
          name: Build root native components
          command: make build-ibare build-truth

  root-pytest:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install native build prerequisites
          command: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run:
          name: Install root Python dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install --prefer-binary -r requirements.txt
      - run:
          name: Build root native components
          command: make build-ibare build-truth
      - run:
          name: Test root project
          command: python -m pytest -q

  root-truth-selftest:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install root Python dependencies
          command: python -m pip install --prefer-binary -r requirements.txt
      - run:
          name: Run truth process self-test
          command: python truth_process.py --tests

  root-truth-pytest:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install root Python dependencies
          command: python -m pip install --prefer-binary -r requirements.txt
      - run:
          name: Run truth process pytest
          command: python -m pytest -q tests/test_truth_process.py

  root-oracle-node:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install root Python dependencies
          command: python -m pip install --prefer-binary -r requirements.txt
      - run:
          name: Test Oracle node
          command: |
            python oracle_node.py
            python -m py_compile omni_node.py oracle_node.py truth_process.py

  root-frontiers:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install root Python dependencies
          command: python -m pip install --prefer-binary -r requirements.txt
      - run:
          name: Test novel PoT frontiers
          command: make test-novel-frontiers

  intelligence-server:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-intelligence-server-npm-{{ checksum "intelligence/server/package.json" }}
            - v1-intelligence-server-npm-
      - run:
          name: Install intelligence server dependencies
          command: cd intelligence/server && npm install
      - save_cache:
          key: v1-intelligence-server-npm-{{ checksum "intelligence/server/package.json" }}
          paths:
            - ~/.npm
      - run:
          name: Build intelligence server
          command: cd intelligence/server && npm run build
      - run:
          name: Test intelligence server
          command: cd intelligence/server && npm test

  tai-compiler:
    docker:
      - image: cimg/rust:1.91
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-tai-compiler-cargo-{{ checksum "intelligence/tai_compiler/Cargo.toml" }}
            - v1-tai-compiler-cargo-
      - run:
          name: Fetch Rust dependencies
          command: cd intelligence/tai_compiler && cargo fetch
      - save_cache:
          key: v1-tai-compiler-cargo-{{ checksum "intelligence/tai_compiler/Cargo.toml" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - run:
          name: Build TAI compiler
          command: cd intelligence/tai_compiler && cargo build
      - run:
          name: Test TAI compiler
          command: cd intelligence/tai_compiler && cargo test

  cloudflare-worker:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - run:
          name: Build check
          command: |
            echo "No package build script exists for cloudflare-worker; repository CI uses syntax validation as its build check."
            node --check cloudflare-worker/index.js
      - run:
          name: Test Cloudflare Worker
          command: node --test cloudflare-worker/test/index.test.mjs

  pot-compile-core:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Compile PoT core
          command: >
            tsc --noEmit --skipLibCheck --target ES2022 --module NodeNext
            --moduleResolution NodeNext
            src/agentic_core/root_cause_agent.ts
            src/anchor/multi_chain_attestation.ts
            src/oracle/chain_oracle.ts
            src/translation/physical_evidence_gate.ts
            src/edge/vonage_pot_registry.ts
            src/edge/imobile_cellular_orchestra.ts

  pot-compile-v2:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Compile Omniscope v2
          command: >
            tsc --noEmit --skipLibCheck --target ES2022 --module NodeNext
            --moduleResolution NodeNext
            src/economy/slashing_engine.ts
            src/crypto/zk_tee_engine.ts
            src/actuation/swarm_verifier.ts
            src/archive/bio_archiver.ts
            src/edge/genesis_seed.ts
            src/omniscope_protocol_v2.ts

  pot-compile-aerial:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Compile aerial and sovereign gates
          command: >
            tsc --noEmit --skipLibCheck --target ES2022 --module NodeNext
            --moduleResolution NodeNext
            src/actuation/a2a_aerial_gate.ts
            src/actuation/aerial_gate.ts
            src/actuation/sovereign_gate.ts

  pot-compile-sentinel-ip:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Compile Sentinel and iP 1&1
          command: >
            tsc --noEmit --skipLibCheck --target ES2022 --module NodeNext
            --moduleResolution NodeNext
            src/ip_one_to_one_engine.ts
            src/sentinel/config_validator.ts
            src/sentinel/heartbeat_monitor.ts
            src/sentinel/sentinel_orchestrator.ts

  pot-core:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Test PoT core integrations
          command: tsx tests/test_pot_integrations.ts && tsx tests/test_chain_oracle.ts

  pot-v2:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Test Omniscope v2
          command: make test-omniscope-v2

  pot-aerial:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Test Aerial A2A and sovereign gate
          command: make test-aerial-actuation

  pot-e2e:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Test Omniscope E2E reference
          command: make test-omniscope-e2e

  pot-ip-one-to-one:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Test iP 1&1 exact match
          command: make test-ip-one-to-one

  pot-sentinel:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install TypeScript test toolchain
          command: npm install --global typescript@5.9.3 tsx@4.20.6 && npm install --no-save --no-package-lock @types/node@24
      - run:
          name: Test Sentinel Swarm production gate
          command: make test-sentinel-swarm

  control-plane-iproof:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install iProof control-plane toolchain
          command: cd control-plane && npm install
      - run:
          name: Compile iKerNeL and iProof engine
          command: cd control-plane && npm run build
      - run:
          name: Test iKerNeL routing and iProof evidence invariants
          command: cd control-plane && npm test

  compute-control-mcp:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - run:
          name: Install Compute Control MCP dependencies
          command: cd mcp/compute-control && npm install
      - run:
          name: Execute iTSC Sovereign Compiler
          command: cd mcp/compute-control && npm run compile:itsc
      - store_artifacts:
          path: mcp/compute-control/itsc-receipt.json
          destination: itsc-compilation-receipt.json
      - run:
          name: Test Compute Control MCP fail-closed receipts
          command: cd mcp/compute-control && npm test

workflows:
  verify-projects:
    jobs:
      - root-native
      - root-pytest
      - root-truth-selftest
      - root-truth-pytest
      - root-oracle-node
      - root-frontiers
      - intelligence-server
      - tai-compiler
      - cloudflare-worker
      - pot-compile-core
      - pot-compile-v2
      - pot-compile-aerial
      - pot-compile-sentinel-ip
      - pot-core
      - pot-v2
      - pot-aerial
      - pot-e2e
      - pot-ip-one-to-one
      - pot-sentinel
      - compute-control-mcp
      - control-plane-iproof
