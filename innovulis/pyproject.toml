[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "innovulis-iverify-spu"
version = "0.4.1"
description = "iNNOVULIS iVerify signed observation API and CPU SPU smoke"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=42,<47",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]
exclude = ["tests*"]

[tool.fastapi]
entrypoint = "api.main:app"
