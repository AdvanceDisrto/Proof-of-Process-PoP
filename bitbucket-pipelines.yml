image: python:3.12-slim
pipelines:
  default:
    - step:
        name: PoP deterministic tests — no live claims
        caches:
          - pip
        script:
          - python -m pip install 'cryptography>=42,<47'
          - python -m compileall -q core proof integrations
          - python -m unittest discover -s tests -p test_frontier_evidence.py -v
          - python -m unittest discover -s tests -p test_pop_inference_print.py -v
          - python -m unittest discover -s tests -p test_ci_oracle.py -v
  custom:
    verified-evidence:
      - step:
          name: Verify external signed PoP receipt — FAIL CLOSED
          script:
            - python -m pip install 'cryptography>=42,<47'
            - python -m integrations.ci_sign_gate
